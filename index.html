      window.googletag = window.googletag || { cmd: [] };
      window.googletag.cmd.push(function() {
        // Automatically collapse empty ad slots

        // Map to track active timeouts per slot ID to prevent duplicate timers
        var timeouts = {};

        window.googletag.pubads().addEventListener('impressionViewable', function(event) {
          var slot = event.slot;
          var slotId = slot.getSlotElementId() || slot.getAdUnitPath();
          console.log('[GAM] Slot became viewable. Initiating 30-second refresh countdown for slot ID:', slotId);
          
          if (timeouts[slotId]) {
            clearTimeout(timeouts[slotId]);
          }
          
          timeouts[slotId] = setTimeout(function() {
            console.log('[GAM] 30-second viewability timer completed. Refreshing slot:', slotId);
            window.googletag.pubads().refresh([slot]);
            delete timeouts[slotId];
          }, 30000);
        });
      });
